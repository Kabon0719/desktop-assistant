name: Build & Package Desktop Assistant

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. Windows 打包任務
  # ==========================================
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Windows Build
        run: |
          python build.py

      - name: Compress Windows Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/桌面助手 -DestinationPath dist/DesktopAssistant-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopAssistant-Windows
          path: dist/DesktopAssistant-Windows.zip

  # ==========================================
  # 2. macOS 打包任務 (Intel x86_64 與通用相容性)
  # ==========================================
  build-macos:
    name: Build macOS (.app)
    runs-on: macos-13

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run macOS Build
        run: |
          python3 build_mac.py

      - name: Compress macOS App Bundle
        run: |
          cd dist
          zip -r -y DesktopAssistant-macOS.zip DesktopAssistant.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopAssistant-macOS
          path: dist/DesktopAssistant-macOS.zip

  # ==========================================
  # 3. 自動建立 GitHub Release 發布下載頁面
  # ==========================================
  create-release:
    name: Publish Public Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: DesktopAssistant-Windows
          path: release_assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: DesktopAssistant-macOS
          path: release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/DesktopAssistant-Windows.zip
            release_assets/DesktopAssistant-macOS.zip
          generate_release_notes: true
          draft: false
          prerelease: false
