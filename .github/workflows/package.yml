name: Build & Package Desktop Assistant

on:
  push:
    branches:
      - master
      - main
      - 跨平台
  pull_request:
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊一鍵觸發打包

jobs:
  # ==========================================
  # 1. Windows 打包任務
  # ==========================================
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Windows Build
        run: |
          python build.py

      - name: Compress Windows Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/桌面助手 -DestinationPath dist/DesktopAssistant-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopAssistant-Windows
          path: dist/DesktopAssistant-Windows.zip

  # ==========================================
  # 2. macOS 打包任務 (雲端原生 Mac 環境)
  # ==========================================
  build-macos:
    name: Build macOS (.app)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run macOS Build
        run: |
          python3 build_mac.py

      - name: Compress macOS App Bundle
        run: |
          cd dist
          zip -r -y DesktopAssistant-macOS.zip DesktopAssistant.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopAssistant-macOS
          path: dist/DesktopAssistant-macOS.zip
